name: secrets

# Fails any push or pull request that adds a secret (Build Spec §13b, hardening).
# Scans only the commits being pushed or proposed, so history that predates the
# purge does not block work. "Run workflow" by hand scans the full history.

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          v=8.21.2
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${v}/gitleaks_${v}_linux_x64.tar.gz" | tar -xz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan the commits in this push or pull request
        if: github.event_name != 'workflow_dispatch'
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -z "$BASE" ] || echo "$BASE" | grep -Eq '^0+$' || ! git cat-file -e "$BASE" 2>/dev/null; then
            range="-1"          # first push of a branch or unknown base: scan the tip commit
          else
            range="$BASE..$HEAD"
          fi
          gitleaks git --redact --verbose --exit-code 1 --log-opts="$range" .

      - name: Full-history scan (manual run)
        if: github.event_name == 'workflow_dispatch'
        run: gitleaks git --redact --verbose --exit-code 1 .
